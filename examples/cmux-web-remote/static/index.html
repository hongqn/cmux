<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="cmux">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>cmux web remote</title>
<style>
  :root { color-scheme: dark; --bg:#111; --panel:#1e1e1e; --line:#2c2c2c; --fg:#ddd; --mute:#888; --acc:#0a84ff; --warn:#e8a33d; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust:100%; text-size-adjust:100%; }
  /* --vvh follows the visual viewport, so the input bar stays above the on-screen keyboard. */
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.4 system-ui,-apple-system,sans-serif; height:var(--vvh, 100dvh); display:flex; flex-direction:column; overflow:hidden;
         padding-left:env(safe-area-inset-left); padding-right:env(safe-area-inset-right); }
  header { display:flex; align-items:center; gap:.6em; padding:.5em .8em; padding-top:max(.5em, env(safe-area-inset-top)); border-bottom:1px solid var(--line); flex:none; }
  header h1 { font-size:1em; margin:0; flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #status { font-size:.85em; color:var(--mute); white-space:nowrap; }
  #status.ok::before { content:"● "; color:#4caf50; }
  #status.bad::before { content:"● "; color:#e55; }
  button { background:#2a2a2a; color:var(--fg); border:1px solid #3a3a3a; border-radius:6px; padding:.35em .7em; font:inherit; cursor:pointer; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  button:hover { border-color:var(--acc); }
  main { flex:1; display:flex; min-height:0; }
  #side { width:280px; flex:none; border-right:1px solid var(--line); overflow-y:auto; overflow-x:hidden; background:var(--panel); padding:0 6px 8px; }
  #filter { position:sticky; top:0; z-index:1; width:calc(100% + 12px); margin:0 -6px 6px; padding:.5em .8em; background:#181818; color:var(--fg); border:0; border-bottom:1px solid var(--line); font:inherit; font-size:12px; }
  #view { flex:1; display:flex; flex-direction:column; min-width:0; }
  /* Sidebar rows: order, sizes and colors follow SidebarWorkspaceRowCellView. */
  .ws { --rowbg:var(--panel); --p:255,255,255; position:relative; margin:0 0 6px; padding:7px 10px 8px 12px; border-radius:8px; cursor:pointer; background:var(--rowbg); color:rgb(var(--p)); }
  .ws:hover { background:#262626; --rowbg:#262626; }
  .ws.active, .ws.active:hover { --rowbg:var(--acc); background:var(--acc); }
  .ws.mac:not(.active) { box-shadow:inset 0 0 0 1px rgba(10,132,255,.55); }
  .ws .rail { position:absolute; left:3px; top:6px; bottom:6px; width:3px; border-radius:2px; }
  .ws .sec { color:rgba(var(--p),.8); }
  .ws-title { display:flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; line-height:1.35; }
  .ws-title .name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:0; }
  .ws-title .ico { width:9px; height:9px; color:rgba(var(--p),.8); flex:none; }
  .badge { flex:none; min-width:16px; height:16px; padding:0 4px; border-radius:8px; background:var(--acc); color:#fff; font-size:10px; font-weight:700; line-height:16px; text-align:center; }
  .ws.active .badge { background:#fff; color:var(--acc); }
  .ws .desc { font-size:10.5px; color:rgba(var(--p),.84); margin-top:2px; white-space:pre-wrap; word-break:break-word; display:-webkit-box; -webkit-line-clamp:12; -webkit-box-orient:vertical; overflow:hidden; }
  .ws .desc a, .ws a { color:inherit; text-decoration:underline; }
  .ws .sub { font-size:10px; color:rgba(var(--p),.8); margin-top:3px; white-space:pre-wrap; word-break:break-word; display:-webkit-box; -webkit-line-clamp:12; -webkit-box-orient:vertical; overflow:hidden; }
  .ws .line { display:flex; align-items:center; gap:5px; font-size:10px; margin-top:3px; color:rgba(var(--p),.8); min-width:0; }
  .ws .line > span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ws .line svg { width:8px; height:8px; flex:none; }
  .ws .more { font-size:10px; margin-top:2px; color:rgba(var(--p),.6); text-decoration:underline; cursor:pointer; }
  .ws .mono { font:10px ui-monospace,SFMono-Regular,Menlo,monospace; color:rgba(var(--p),.75); margin-top:3px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ws .bar { height:3px; border-radius:2px; background:rgba(var(--p),.15); margin-top:5px; overflow:hidden; }
  .ws .bar > i { display:block; height:100%; background:rgba(var(--p),.8); }
  .ws .links { display:flex; flex-wrap:wrap; gap:8px; font:10px ui-monospace,Menlo,monospace; margin-top:3px; color:rgba(var(--p),.8); }
  #panes { flex:1; display:flex; min-height:0; background:#000; }
  .split { display:flex; flex:1; min-width:0; min-height:0; gap:2px; }
  .split.h { flex-direction:row; } .split.v { flex-direction:column; }
  .pane { display:flex; flex-direction:column; min-width:0; min-height:0; border:1px solid #222; }
  .pane.active { border-color:var(--acc); }
  .tabs { display:flex; gap:1px; background:#161616; overflow-x:auto; flex:none; }
  .tab { border:0; border-radius:0; background:none; color:var(--mute); padding:.25em .7em; font-size:.8em; white-space:nowrap; max-width:16em; overflow:hidden; text-overflow:ellipsis; }
  .tab.on { color:var(--fg); background:#262626; box-shadow:inset 0 -2px var(--acc); }
  .tab.mac::after { content:" ●"; color:var(--acc); }
  .zoom, .fontmode { border:0; background:none; color:var(--mute); padding:0 .6em; font-size:.9em; flex:none; }
  .tabs .spacer { margin-left:auto; }
  .fontmode { display:none; }
  #paneStrip { display:none; }
  .term { flex:1; margin:0; padding:.3em .4em; overflow:auto; -webkit-overflow-scrolling:touch; overscroll-behavior:contain; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; line-height:1.2; white-space:pre; }
  .term .cur { outline:1px solid currentColor; }
  .note { flex:1; display:flex; align-items:center; justify-content:center; color:var(--mute); padding:1em; text-align:center; word-break:break-all; }
  #bar { display:flex; flex-wrap:wrap; gap:.4em; padding:.5em; padding-bottom:max(.5em, env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:var(--panel); flex:none; }
  #target { width:100%; font-size:.8em; color:var(--mute); }
  #input { flex:1 1 240px; min-height:2.4em; max-height:8em; background:#0f0f0f; color:var(--fg); border:1px solid #3a3a3a; border-radius:6px; padding:.4em; font:13px ui-monospace,Menlo,monospace; resize:vertical; }
  #keys { display:flex; flex-wrap:wrap; gap:.3em; width:100%; }
  #keys button { font-size:.85em; }
  /* Notifications popover: layout of cmux's NotificationsPage. */
  #bell { position:relative; padding:.3em .55em; }
  #bell svg { width:16px; height:16px; vertical-align:-3px; }
  #bell .badge { position:absolute; top:-5px; right:-6px; }
  #notifs { position:fixed; top:calc(46px + env(safe-area-inset-top)); right:10px; z-index:10; width:400px; max-height:calc(100dvh - 60px); display:none; flex-direction:column; background:#232323; border:1px solid #3a3a3a; border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.5); }
  body.show-notifs #notifs { display:flex; }
  #notifs .head { display:flex; align-items:center; gap:8px; padding:12px 16px; }
  #notifs .head h2 { font-size:17px; font-weight:600; margin:0; flex:1; }
  #notifs .head button { font-size:12px; }
  #nlist { overflow:auto; padding:0 12px 12px; display:flex; flex-direction:column; gap:8px; }
  .n { display:flex; align-items:flex-start; gap:12px; padding:12px; border-radius:10px; background:#2d2d2d; cursor:pointer; }
  .n:hover { background:#353535; }
  .n .dot { flex:none; width:8px; height:8px; margin-top:6px; border-radius:50%; border:1px solid rgba(10,132,255,.2); }
  .n.unread .dot { background:var(--acc); border-color:var(--acc); }
  .n .main { flex:1; min-width:0; display:flex; flex-direction:column; gap:6px; }
  .n .top { display:flex; gap:8px; align-items:baseline; }
  .n .nt { font-weight:600; font-size:13px; flex:1; min-width:0; }
  .n .time, .n .tab { font-size:11px; color:var(--mute); white-space:nowrap; }
  .n .nb { font-size:12px; color:#aaa; white-space:pre-wrap; word-break:break-word; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .n .x { flex:none; border:0; background:none; padding:0 2px; color:var(--mute); font-size:15px; line-height:1; }
  .n-empty { text-align:center; color:var(--mute); padding:28px 16px; }
  .n-empty b { display:block; color:var(--fg); margin-bottom:4px; }
  #notifs .foot { border-top:1px solid #333; padding:8px 16px; font-size:11px; color:var(--mute); }
  #notifs .foot button { font-size:11px; padding:.2em .6em; }
  .empty { color:var(--mute); padding:1em; }
  /* Agent chat view. */
  .viewtoggle { border:0; background:#2c2c2c; color:var(--fg); padding:.15em .7em; margin:2px 4px; font-size:.8em; border-radius:10px; flex:none; }
  .chat { flex:1; display:flex; flex-direction:column; min-height:0; background:var(--bg); }
  .chat-scroll { flex:1; overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch; padding:12px 14px 8px; }
  .chat-older { display:block; margin:0 auto 10px; font-size:12px; }
  .msgs { display:flex; flex-direction:column; gap:10px; max-width:820px; margin:0 auto; font-size:14.5px; line-height:1.5; }
  .msg { overflow-wrap:anywhere; }
  .msg.user { align-self:flex-end; max-width:85%; background:#2f2f2f; border-radius:16px; padding:8px 13px; white-space:pre-wrap; }
  .msg.user.pending { opacity:.55; } .msg.user.failed { outline:1px solid #e55; }
  .msg.note { align-self:center; font-size:12px; color:var(--mute); }
  .msg.bot p { margin:.35em 0; } .msg.bot ul, .msg.bot ol { margin:.35em 0; padding-left:1.4em; }
  .msg.bot .h { font-weight:650; margin:.7em 0 .25em; } .msg.bot .h1 { font-size:1.2em; } .msg.bot .h2 { font-size:1.1em; }
  .msg.bot code { font:12.5px ui-monospace,Menlo,monospace; background:#262626; padding:.05em .3em; border-radius:4px; }
  .msg a { color:#5aa9ff; }
  .msg blockquote { margin:.4em 0; padding-left:.8em; border-left:3px solid #3a3a3a; color:#bbb; }
  .msg hr { border:0; border-top:1px solid #333; }
  .tablewrap { overflow-x:auto; } .msg table { border-collapse:collapse; font-size:13px; margin:.4em 0; }
  .msg th, .msg td { border:1px solid #333; padding:.25em .55em; text-align:left; vertical-align:top; }
  pre.code { font:12px/1.4 ui-monospace,Menlo,monospace; background:#181818; border:1px solid #2a2a2a; border-radius:8px; padding:.6em .7em; overflow-x:auto; margin:.4em 0; white-space:pre; }
  pre.diff .add { color:#7ee787; } pre.diff .del { color:#ff7b72; }
  .steps { font-size:13px; color:var(--mute); }
  .steps > summary { cursor:pointer; list-style:none; display:flex; gap:.6em; padding:2px 0; }
  .steps > summary::before { content:"▸"; } .steps[open] > summary::before { content:"▾"; }
  .steps .gl { flex:none; } .steps .gs { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:#666; min-width:0; }
  .step { margin:4px 0 4px 1em; }
  .step > summary { cursor:pointer; list-style:none; display:flex; align-items:baseline; gap:.45em; min-width:0; }
  .step .st::before { content:"…"; color:var(--mute); } .step.ok .st::before { content:"✓"; color:#4caf50; } .step.err .st::before { content:"✗"; color:#e55; }
  .step b { color:#ccc; font-weight:600; flex:none; } .step .ti { flex:none; width:1.1em; text-align:center; }
  .step .ts { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; font-family:ui-monospace,Menlo,monospace; font-size:12px; }
  .step .diffstat { flex:none; font-size:11px; } .diffstat i { color:#7ee787; font-style:normal; } .diffstat u { color:#ff7b72; text-decoration:none; }
  .step .sb { margin-left:1.3em; }
  .step pre.code { max-height:45vh; overflow:auto; }
  .todos div { padding:1px 0; } .todos .completed { text-decoration:line-through; color:#666; }
  .msg.question { background:#1d2733; border:1px solid #2b4767; border-radius:12px; padding:10px 12px; }
  .question .qh { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:#8fb8e8; }
  .question .qo { display:flex; flex-direction:column; gap:6px; margin-top:8px; }
  .question .qo button { text-align:left; display:flex; flex-direction:column; gap:2px; padding:.5em .7em; border-radius:9px; }
  .question .qo span { font-size:12px; color:var(--mute); }
  .question.answered .qo { display:none; } .question .answer { font-size:13px; color:#9fd09f; margin-top:6px; }
  .question .answer:empty { display:none; }
  .chat-status { flex:none; display:flex; align-items:center; gap:.6em; padding:0 14px; font-size:13px; color:var(--mute); }
  .chat-status:empty { display:none; }
  .chat-status.working { padding:6px 14px; } .chat-status.working button { margin-left:auto; }
  .chat-status.ended, .chat-status.error { padding:6px 14px; }
  .chat-status.needs_input { flex-direction:column; align-items:stretch; padding:8px 12px; background:#2a2312; border-top:1px solid #6b5520; color:#f0d48a; }
  .peek { margin:6px 0; max-height:40vh; overflow:auto; font:11px/1.25 ui-monospace,Menlo,monospace; background:#000; color:#ddd; padding:6px; border-radius:6px; white-space:pre; }
  .peek-keys { display:flex; gap:6px; flex-wrap:wrap; } .peek-keys button { min-width:44px; }
  .spin { width:10px; height:10px; border-radius:50%; border:2px solid var(--acc); border-right-color:transparent; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  body.chat-mode #sendRawBtn { display:none; }
  #toggleSide { display:none; }
  #scrim { display:none; }
  @media (max-width: 900px) {
    #toggleSide { display:inline-block; }
    header { padding-left:.5em; padding-right:.5em; gap:.4em; }
    header button { min-width:40px; min-height:36px; }
    #status { font-size:0; } #status::before { font-size:13px; }  /* the dot alone */
    /* Drawer over the page, with a scrim that closes it. */
    #side { position:fixed; top:0; bottom:0; left:0; z-index:6; width:min(85vw, 340px); display:none;
            padding-top:env(safe-area-inset-top); padding-bottom:env(safe-area-inset-bottom); }
    body.show-side #side { display:block; }
    body.show-side #scrim { display:block; position:fixed; inset:0; z-index:5; background:rgba(0,0,0,.5); }
    .ws { padding:10px 12px 11px 14px; }
    .ws-title { font-size:15px; } .ws .desc { font-size:12.5px; } .ws .sub, .ws .line, .ws .mono, .ws .links { font-size:12px; }
    #filter { font-size:16px; }
    #notifs { left:8px; right:8px; width:auto; }
    /* Phones: one pane at a time, filling the space; a strip switches panes. */
    #panes { flex-direction:column; }
    #paneStrip { display:flex; gap:6px; padding:6px; overflow-x:auto; background:#161616; flex:none; scrollbar-width:none; }
    #paneStrip button { flex:none; max-width:60vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:13px; padding:.3em .8em; border-radius:14px; }
    #paneStrip button.on { background:var(--acc); border-color:var(--acc); color:#fff; }
    #paneStrip button.unread::after { content:" ●"; color:var(--acc); }
    #paneStrip button.on.unread::after { color:#fff; }
    .pane { flex:1 1 0 !important; border:0; }
    .tab { font-size:13px; padding:.45em .8em; }
    .zoom { display:none; }
    #paneStrip ~ .pane.single .tab { display:none; }  /* the chip above already names it */
    /* ...so its bar keeps only buttons; float them into the chip row. */
    #panes { position:relative; }
    #paneStrip { padding-right:110px; }
    #paneStrip ~ .pane.single .tabs { position:absolute; top:0; right:0; height:44px; align-items:center; background:#161616; padding:0 4px 0 8px; z-index:2; }
    .fontmode { display:block; font-size:13px; }
    .msgs { font-size:15.5px; } .chat-scroll { padding:10px 10px 6px; }
    .viewtoggle { font-size:13px; padding:.3em .8em; }
    /* Compact input bar: text box and send on one row, keys in one scrolling row. */
    #target { display:none; }
    #bar { gap:.35em; padding:.4em; padding-bottom:max(.4em, env(safe-area-inset-bottom)); }
    #input { flex:1 1 0; min-width:0; font-size:16px; min-height:0; height:2.3em; resize:none; padding:.35em .5em; }
    #sendBtn, #sendRawBtn { padding:.35em .6em; }
    #keys { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; gap:.35em; }
    #keys::-webkit-scrollbar, #paneStrip::-webkit-scrollbar { display:none; }
    #keys button { flex:none; min-height:36px; min-width:44px; font-size:14px; }
    #showOnMac { margin-left:0 !important; }
  }
</style>
</head>
<body>
<header>
  <button id="toggleSide">☰</button>
  <h1 id="title">cmux web remote</h1>
  <span id="status" class="bad">connecting</span>
  <button id="bell" title="Notifications"><svg viewBox="0 0 16 16"><path fill="currentColor" d="M8 15.5a2 2 0 0 0 2-2H6a2 2 0 0 0 2 2zm5.5-4.2-1-1.3V7a4.5 4.5 0 0 0-3.6-4.4V2a.9.9 0 1 0-1.8 0v.6A4.5 4.5 0 0 0 3.5 7v3l-1 1.3a.6.6 0 0 0 .5 1h10a.6.6 0 0 0 .5-1z"/></svg><span id="unreadCount" class="badge" hidden>0</span></button>
</header>
<main>
  <div id="scrim"></div>
  <nav id="side"><input id="filter" type="search" placeholder="Filter workspaces"><div id="wslist"><div class="empty">Loading…</div></div></nav>
  <section id="view">
    <div id="panes"><div class="empty">Pick a workspace on the left.</div></div>
    <div id="bar">
      <div id="target">Click a terminal pane to type into it.</div>
      <textarea id="input" rows="1" placeholder="Type text, Enter sends it with a newline, Shift+Enter for a new line"
        autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="send"></textarea>
      <button id="sendBtn">Send ⏎</button>
      <button id="sendRawBtn" title="Send without pressing Enter">Send</button>
      <div id="keys">
        <button data-key="enter">Enter</button>
        <button data-key="escape">Esc</button>
        <button data-key="ctrl+c">Ctrl‑C</button>
        <button data-key="tab">Tab</button>
        <button data-key="shift+tab" title="Shift+Tab">⇧Tab</button>
        <button data-key="up">↑</button>
        <button data-key="down">↓</button>
        <button data-key="left">←</button>
        <button data-key="right">→</button>
        <button data-key="ctrl+d">Ctrl‑D</button>
        <button data-key="pageup">PgUp</button>
        <button data-key="pagedown">PgDn</button>
        <button id="showOnMac" style="margin-left:auto" title="Switch the Mac's window to this workspace">Show on Mac</button>
      </div>
    </div>
  </section>
  <aside id="notifs">
    <div class="head"><h2>Notifications</h2><button id="jumpUnread" title="Jump to Latest Unread">Jump to Latest Unread</button><button id="clearAll">Clear All</button></div>
    <div id="nlist"></div>
    <div class="foot">Browser notifications: <button id="enableNotify">Enable</button></div>
  </aside>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const PHONE = matchMedia("(max-width: 900px)");
const state = {
  tree: null,
  wsId: null,          // workspace shown in the main area
  shown: {},           // paneId -> surfaceId picked here (defaults to the Mac's tab)
  activePane: null,    // pane that receives typed input
  screens: {},         // surfaceId -> {revision, grid?, text?}
  notifications: [],
  expanded: new Set(), // workspaces whose status list shows all pills
  poll: null,          // {key, abort}
  zoomPane: null,      // pane shown alone, when zoomed
  fromBottom: {},
  // Phones: "fit" shrinks the font to show every column; "read" keeps it legible and scrolls sideways.
  fontMode: localStorage.getItem("cmuxWebFontMode") || "fit",
  // Claude Code terminals: "chat" (transcript) or "terminal" (screen); phones default to chat.
  viewPref: localStorage.getItem("cmuxWebAgentView") || (PHONE.matches ? "chat" : "terminal"),
  viewBySurface: {},
  chats: {},           // sessionId -> chat view state and its DOM
  chatPolls: {},       // sessionId -> {abort}      // surfaceId -> px scrolled up from the bottom (absent = follow the bottom)
};

async function api(path, body, signal) {
  const opts = body === undefined ? { signal } : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body), signal };
  const res = await fetch(path, opts);
  if (res.status === 401) { location.href = "/"; throw new Error("unauthorized"); }
  const data = await res.json();
  if (!res.ok) throw new Error(data.message || data.error || res.statusText);
  return data;
}

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  Object.assign(node, props || {});
  for (const c of children) if (c != null) node.append(c);
  return node;
}

// ---- SF Symbols used by sidebar rows, as small SVGs ------------------------
const SYMBOLS = {
  "bolt.fill": '<path d="M9.5 0 2.5 9h4.2L5.8 16l7.2-9.5H8.6z"/>',
  "circle.fill": '<circle cx="8" cy="8" r="6"/>',

function symbol(name, color) {

  svg.setAttribute("viewBox", "0 0 16 16");
  svg.setAttribute("fill", "currentColor");
  svg.innerHTML = SYMBOLS[name] || SYMBOLS["circle.fill"];
  if (color) svg.style.color = color;
  return svg;
}
// A status pill's icon: "emoji:x", "text:x", "sf:name" or a bare SF Symbol name.
function statusIcon(icon, color) {
  if (!icon) return null;
  if (icon.startsWith("emoji:") || icon.startsWith("text:")) {
    return el("b", { textContent: icon.slice(icon.indexOf(":") + 1), style: "font-size:9px;flex:none;" + (color ? "color:" + color : "") });
  }
  return symbol(icon.replace(/^sf:/, ""), color);

// cmux renders Markdown in descriptions and strips it from notification previews.
function plainMarkdown(text) {
  return String(text || "").replace(/\x1b\[[0-9;?]*[ -\/]*[@-~]/g, "").replace(/\[([^\]]+)\]\([^)]+\)/g, "$1").replace(/(\*\*|__|`)/g, "");
}
function markdownInline(text) {
  const frag = document.createDocumentFragment();
  const re = /\[([^\]]+)\]\((https?:[^)\s]+)\)|\*\*([^*]+)\*\*|`([^`]+)`/g;
  let last = 0, m;
  while ((m = re.exec(text))) {
    frag.append(text.slice(last, m.index));
    if (m[1]) frag.append(el("a", { href: m[2], target: "_blank", rel: "noopener", textContent: m[1], onclick: (e) => e.stopPropagation() }));
    else if (m[3]) frag.append(el("b", { textContent: m[3] }));
    else frag.append(el("code", { textContent: m[4] }));
    last = re.lastIndex;
  }
  frag.append(text.slice(last));

}
const LOG_ICONS = { info: "circle.fill", progress: "arrowtriangle.right.fill", success: "checkmark.circle.fill", warning: "exclamationmark.triangle.fill", error: "xmark.circle.fill" };
const LOG_COLORS = { warning: "#FF9F0A", error: "#FF453A", success: "#32D74B" };

// ---- model helpers ----------------------------------------------------------
function allWorkspaces() {
  return ((state.tree && state.tree.windows) || []).flatMap((w) => w.workspaces);
}
function currentWorkspace() {
  return allWorkspaces().find((w) => w.id === state.wsId) || null;
}
function shownSurface(pane) {
  const picked = state.shown[pane.id];
  if (picked && pane.surfaces.some((s) => s.id === picked)) return pane.surfaces.find((s) => s.id === picked);
  return pane.surfaces.find((s) => s.id === pane.selected_surface_id) || pane.surfaces[0] || null;
}
function findSurface(surfaceId) {
  for (const ws of allWorkspaces()) for (const pane of ws.panes) for (const s of pane.surfaces)
    if (s.id === surfaceId) return { ws, pane, surface: s };
  return null;
}
function unreadFor(ws) {
  // cmux's own count wins; the notification list fills in between tree reloads.
  const listed = state.notifications.filter((n) => !n.is_read && n.workspace_id === ws.id).length;
  return Math.max(ws.unread_count || 0, listed);
}

// ---- sidebar ----------------------------------------------------------------
async function loadTree() {
  try {
    state.tree = await api("/api/tree");
    if (!currentWorkspace()) {
      const onMac = allWorkspaces().find((w) => w.selected) || allWorkspaces()[0];
      state.wsId = onMac ? onMac.id : null;
    }
    renderTree();
    renderWorkspace();
  } catch (e) { $("wslist").replaceChildren(el("div", { className: "empty", textContent: "Error: " + e.message })); }
}

function matchesFilter(ws, needle) {
  if (!needle) return true;
  const titles = ws.panes.flatMap((p) => p.surfaces.map((s) => s.title));
  return [ws.title, ws.description, ws.directory, ws.branch, ws.latest_notification_text, ...titles].join("\n").toLowerCase().includes(needle);
}

function renderTree() {
  const side = $("wslist");
  const needle = $("filter").value.trim().toLowerCase();
  side.replaceChildren();
  const windows = (state.tree && state.tree.windows) || [];
  windows.forEach((win, wi) => {
    if (windows.length > 1) side.append(el("div", { className: "ws-meta", style: "padding:.4em .7em", textContent: "Window " + (wi + 1) }));
    for (const ws of win.workspaces) {
      if (!matchesFilter(ws, needle)) continue;
      side.append(sidebarRow(ws));
      continue;
    }
  });
  const add = el("button", { textContent: "+ New workspace", style: "margin:.7em" });
  add.onclick = async () => {
    const cwd = prompt("Working directory (optional)", "");
    if (cwd === null) return;
    const r = await api("/api/workspace/create", cwd ? { cwd } : {});
    state.wsId = r.workspace_id || state.wsId;
    loadTree();
  };
  side.append(add);
}

function sidebarRow(ws) {
  const sb = ws.sidebar || {};
  const box = el("div", { className: "ws" + (ws.id === state.wsId ? " active" : "") + (ws.selected ? " mac" : ""),
    title: ws.selected ? "Shown on the Mac" : "" });
  if (ws.custom_color) box.append(el("i", { className: "rail", style: "background:" + ws.custom_color }));
  const unread = unreadFor(ws);
  const title = el("div", { className: "ws-title" });
  if (unread) title.append(el("span", { className: "badge", textContent: String(unread) }));
  if (ws.pinned) { const pin = symbol("pin.fill"); pin.classList.add("ico"); title.append(pin); }
  title.append(el("span", { className: "name", textContent: ws.title || ws.ref || "workspace" }));
  box.append(title);
  if (ws.description) box.append(el("div", { className: "desc" }, markdownInline(ws.description)));
  if (ws.latest_notification_text) box.append(el("div", { className: "sub", textContent: plainMarkdown(ws.latest_notification_text).trim() }));
  const statuses = sb.statuses || [];
  const showAll = state.expanded.has(ws.id);
  for (const st of showAll ? statuses : statuses.slice(0, 3)) {
    const text = st.format === "markdown" ? markdownInline(st.value) : st.value;
    const label = st.url && st.format !== "markdown"
      ? el("a", { href: st.url, target: "_blank", rel: "noopener", textContent: st.value, onclick: (e) => e.stopPropagation() })
      : el("span", {}, text);
    if (st.color) label.style.color = st.color;
    box.append(el("div", { className: "line" }, statusIcon(st.icon, st.color), label));
  }
  if (statuses.length > 3) {
    const more = el("div", { className: "more", textContent: showAll ? "Show less" : "Show more" });
    more.onclick = (e) => { e.stopPropagation(); showAll ? state.expanded.delete(ws.id) : state.expanded.add(ws.id); renderTree(); };
    box.append(more);
  }
  if (sb.log) {
    const color = LOG_COLORS[sb.log.level] || (sb.log.level === "info" ? "rgba(var(--p),.5)" : "rgba(var(--p),.8)");
    box.append(el("div", { className: "line" }, symbol(LOG_ICONS[sb.log.level] || "circle.fill", color), el("span", { textContent: sb.log.message })));
  }
  if (sb.progress) {
    const bar = el("div", { className: "bar", title: sb.progress.label || "" }, el("i", { style: `width:${Math.round(sb.progress.value * 100)}%` }));
    box.append(bar);
    if (sb.progress.label) box.append(el("div", { className: "line" }, el("span", { textContent: sb.progress.label })));
  }
  if (ws.branch) box.append(el("div", { className: "mono", textContent: ws.branch + (ws.git_dirty || sb.git_dirty ? "*" : "") }));
  if (ws.directory) box.append(el("div", { className: "mono", textContent: ws.directory }));
  const links = el("div", { className: "links" });
  for (const url of ws.pull_requests || []) {
    const num = (url.match(/\/pull\/(\d+)/) || [])[1];
    links.append(el("a", { href: url, target: "_blank", rel: "noopener", textContent: num ? "PR #" + num : "PR", onclick: (e) => e.stopPropagation() }));
  }
  for (const port of ws.ports || []) {
    links.append(el("a", { href: `${location.protocol}//${location.hostname}:${port}`, target: "_blank", rel: "noopener", textContent: ":" + port, onclick: (e) => e.stopPropagation() }));
  }
  if (links.childNodes.length) box.append(links);
  box.onclick = () => { openWorkspace(ws.id); document.body.classList.remove("show-side"); };
  return box;
}

function openWorkspace(wsId, paneId, surfaceId) {
  if (wsId !== state.wsId) state.zoomPane = null;
  state.wsId = wsId;
  state.activePane = paneId || null;
  if (paneId && surfaceId) state.shown[paneId] = surfaceId;
  renderTree();
  renderWorkspace();
}

// ---- workspace view: split layout, panes, tabs --------------------------------
function renderWorkspace() {
  const ws = currentWorkspace();
  const root = $("panes");
  if (!ws) { root.replaceChildren(el("div", { className: "empty", textContent: "Pick a workspace on the left." })); updateTarget(); return; }
  $("title").textContent = ws.title || ws.ref;
  const panesById = Object.fromEntries(ws.panes.map((p) => [p.id, p]));
  if (!state.activePane || !panesById[state.activePane]) {
    const focused = ws.panes.find((p) => p.focused && (shownSurface(p) || {}).type === "terminal");
    const anyTerm = ws.panes.find((p) => (shownSurface(p) || {}).type === "terminal");
    state.activePane = (focused || anyTerm || ws.panes[0] || {}).id || null;
  }
  if (PHONE.matches) {
    const only = buildPane(panesById[state.activePane] || ws.panes[0]);
    only.style.flex = "1 1 0";
    root.replaceChildren(...[ws.panes.length > 1 ? paneStrip(ws) : null, only].filter(Boolean));
  } else if (state.zoomPane && panesById[state.zoomPane]) {
    const only = buildPane(panesById[state.zoomPane]);
    only.style.flex = "1 1 0";
    root.replaceChildren(only);
  } else {
    state.zoomPane = null;
    const seen = new Set();
    const node = ws.layout ? buildLayout(ws.layout, panesById, seen) : null;
    const rest = ws.panes.filter((p) => !seen.has(p.id)).map(buildPane);  // panes the layout did not mention
    for (const r of rest) r.style.flex = "1 1 0";
    root.replaceChildren(...[node, ...rest].filter(Boolean));
  }
  // Panes are built detached, where scrollHeight is 0; place them once attached.
  for (const pre of root.querySelectorAll("pre.term, .chat-scroll")) restoreScroll(pre);
  updateTarget();
  restartPolling();
  restartChatPolls();
  markPaneRead();
}

// Focusing a pane in cmux marks its notifications read; opening a workspace
// marks its workspace-level ones. Do the same for the pane picked here.
function markPaneRead() {
  const ws = currentWorkspace();
  const pane = ws && ws.panes.find((p) => p.id === state.activePane);
  const shown = pane && shownSurface(pane);
  const unread = state.notifications.filter((n) => !n.is_read && n.workspace_id === (ws && ws.id));
  const forPane = shown && unread.some((n) => n.surface_id === shown.id);
  const forWorkspace = unread.some((n) => !n.surface_id);
  if (!forPane && !forWorkspace) return;
  for (const n of unread) if (!n.surface_id || (shown && n.surface_id === shown.id)) n.is_read = true;
  renderNotifications();
  const calls = [];
  if (forPane) calls.push(api("/api/notifications/read", { workspace_id: ws.id, surface_id: shown.id }));
  if (forWorkspace) for (const n of unread.filter((x) => !x.surface_id)) calls.push(api("/api/notifications/read", { id: n.id }));
  Promise.allSettled(calls).then(() => { scheduleTree(); });
}

// Phones show one pane; this row of chips switches between them, in layout order.
function paneStrip(ws) {
  const order = [];
  const walk = (node) => { if (!node) return; if (node.pane) order.push(node.pane.id); (node.children || []).forEach(walk); };
  walk(ws.layout);
  const panes = [...order.map((id) => ws.panes.find((p) => p.id === id)).filter(Boolean),
                 ...ws.panes.filter((p) => !order.includes(p.id))];
  const strip = el("div", { id: "paneStrip" });
  for (const pane of panes) {
    const shown = shownSurface(pane);
    const unread = state.notifications.some((n) => !n.is_read && pane.surfaces.some((s) => s.id === n.surface_id));
    const chip = el("button", {
      className: (pane.id === state.activePane ? "on" : "") + (unread ? " unread" : ""),
      textContent: shown ? (shown.title || shown.ref) : "(empty)",
    });
    chip.onclick = () => { state.activePane = pane.id; renderWorkspace(); };
    strip.append(chip);
  }
  requestAnimationFrame(() => { const on = strip.querySelector(".on"); if (on) on.scrollIntoView({ inline: "nearest", block: "nearest" }); });
  return strip;
}

function buildLayout(node, panesById, seen) {
  if (node.pane) {
    const pane = panesById[node.pane.id];
    if (!pane) return null;
    seen.add(pane.id);
    return buildPane(pane);
  }
  const kids = (node.children || []).map((c) => buildLayout(c, panesById, seen)).filter(Boolean);
  if (kids.length === 1) return kids[0];
  const box = el("div", { className: "split " + (node.direction === "vertical" ? "v" : "h") });
  const ratio = typeof node.split === "number" && kids.length === 2 ? node.split : null;
  kids.forEach((kid, i) => {
    kid.style.flex = ratio === null ? "1 1 0" : `${i === 0 ? ratio : 1 - ratio} 1 0`;
    box.append(kid);
  });
  return box;
}

function buildPane(pane) {
  const shown = shownSurface(pane);
  const tabs = el("div", { className: "tabs" });
  for (const s of pane.surfaces) {
    const t = el("button", {
      className: "tab" + (shown && s.id === shown.id ? " on" : "") + (s.id === pane.selected_surface_id ? " mac" : ""),
      textContent: (s.type === "terminal" ? "" : s.type === "browser" ? "🌐 " : "📄 ") + (s.title || s.ref),
      title: (s.title || "") + (s.id === pane.selected_surface_id ? " (shown on the Mac)" : ""),
    });
    t.onclick = (e) => { e.stopPropagation(); state.shown[pane.id] = s.id; state.activePane = pane.id; renderWorkspace(); };
    tabs.append(t);
  }
  tabs.append(el("span", { className: "spacer" }));
  const view = viewFor(shown);
  if (shown && shown.agent && shown.agent.chat) {
    const vt = el("button", { className: "viewtoggle", textContent: view === "chat" ? "Terminal" : "Chat",
                              title: view === "chat" ? "Show the terminal screen" : "Show the conversation" });
    vt.onclick = (e) => {
      e.stopPropagation();
      const next = view === "chat" ? "terminal" : "chat";
      state.viewBySurface[shown.id] = next;
      state.viewPref = next;
      localStorage.setItem("cmuxWebAgentView", next);
      state.activePane = pane.id;
      renderWorkspace();
    };
    tabs.append(vt);
  }
  if (shown && shown.type === "terminal" && view === "terminal") {
    const fm = el("button", { className: "fontmode", textContent: state.fontMode === "fit" ? "Aa+" : "Aa−",
                              title: state.fontMode === "fit" ? "Larger text, scroll sideways" : "Fit every column" });
    fm.onclick = (e) => {
      e.stopPropagation();
      state.fontMode = state.fontMode === "fit" ? "read" : "fit";
      localStorage.setItem("cmuxWebFontMode", state.fontMode);
      renderWorkspace();
    };
    tabs.append(fm);
  }
  const zoomed = state.zoomPane === pane.id;
  const zoom = el("button", { className: "zoom", textContent: zoomed ? "⤡" : "⤢", title: zoomed ? "Show all panes" : "Show only this pane" });
  zoom.onclick = (e) => { e.stopPropagation(); state.zoomPane = zoomed ? null : pane.id; state.activePane = pane.id; renderWorkspace(); };
  tabs.append(zoom);
  const box = el("div", { className: "pane" + (pane.id === state.activePane ? " active" : "") + (pane.surfaces.length === 1 ? " single" : "") }, tabs);
  box.dataset.pane = pane.id;
  box.onclick = () => {
    state.activePane = pane.id;
    document.querySelectorAll(".pane.active").forEach((p) => p.classList.remove("active"));
    box.classList.add("active");
    updateTarget();
    markPaneRead();
  };
  if (shown && view === "chat") {
    const chat = chatState(shown.agent.session_id);
    chat.surfaceId = shown.id;
    chat.root.dataset.session = shown.agent.session_id;
    chat.scroll.dataset.surface = shown.id + ":chat";
    if (!chat.loaded) chat.status.textContent = "Loading conversation…";
    box.append(chat.root);
  } else if (shown && shown.type === "terminal") {
    const pre = el("pre", { className: "term" });
    pre.dataset.surface = shown.id;
    pre.addEventListener("scroll", () => rememberScroll(pre), { passive: true });
    box.append(pre);
    const cached = state.screens[shown.id];
    if (cached) paintScreen(pre, cached); else pre.textContent = "Loading…";
  } else if (shown) {
    box.append(el("div", { className: "note", textContent: `${shown.type}: ${shown.url || shown.title || ""}\n(not mirrored)` }));
  }
  return box;
}

function activeTerminal() {
  const ws = currentWorkspace();
  const pane = ws && ws.panes.find((p) => p.id === state.activePane);
  const s = pane && shownSurface(pane);
  return s && s.type === "terminal" ? s : null;
}

function updateTarget() {
  const s = activeTerminal();
  const chat = chatSurface();
  $("target").textContent = chat ? "Message to Claude in: " + (s.title || s.ref)
    : s ? "Typing into: " + (s.title || s.ref) : "Click a terminal pane to type into it.";
  document.body.classList.toggle("chat-mode", !!chat);
  $("input").placeholder = chat ? (PHONE.matches ? "Message Claude" : "Message Claude; Enter sends, Shift+Enter for a new line")
    : PHONE.matches ? "Type here; Enter sends" : "Type text, Enter sends it with a newline, Shift+Enter for a new line";
  $("input").enterKeyHint = chat && PHONE.matches ? "enter" : "send";
}

// ---- agent chat view ----------------------------------------------------------
// Terminals running Claude Code can show their conversation instead of the
// screen: read from the session's transcript, so text wraps to the page rather
// than to the terminal's columns. Input still goes to the same terminal.

function viewFor(s) {
  if (!s || s.type !== "terminal" || !(s.agent && s.agent.chat)) return "terminal";
  return state.viewBySurface[s.id] || state.viewPref;
}
function chatSurface() {
  const s = activeTerminal();
  return s && viewFor(s) === "chat" ? s : null;
}

function esc(s) {
  return s.replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Markdown subset: fences, headings, lists, quotes, tables, rules, inline code,
// bold, italics, http(s) links. Text is escaped before any markup is added.
function mdInline(raw) {
  const codes = [];
  let s = esc(raw).replace(/`([^`\n]+)`/g, (m, c) => { codes.push(c); return `\u0000${codes.length - 1}\u0000`; });
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>").replace(/(^|[^*\w])\*([^*\n]+)\*(?!\w)/g, "$1<i>$2</i>");
  return s.replace(/\u0000(\d+)\u0000/g, (m, i) => `<code>${codes[+i]}</code>`);
}

function md(text) {
  const lines = text.replace(/\r/g, "").split("\n");
  const out = [];
  const isList = (l) => /^\s*([-*+]|\d+[.)])\s+/.test(l);
  const isBlockStart = (l) => /^\s*(```|#{1,6}\s|>|([-*+]|\d+[.)])\s+|\|)/.test(l);
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (/^\s*```/.test(l)) {
      const buf = [];
      i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(`<pre class="code">${esc(buf.join("\n"))}</pre>`);
    } else if (/^\s*\|.*\|\s*$/.test(l) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      const row = (r) => r.trim().replace(/^\||\|$/g, "").split("|").map((c) => mdInline(c.trim()));
      const head = row(l);
      i += 2;
      const body = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) body.push(row(lines[i++]));
      out.push(`<div class="tablewrap"><table><tr>${head.map((c) => `<th>${c}</th>`).join("")}</tr>` +
        body.map((r) => `<tr>${r.map((c) => `<td>${c}</td>`).join("")}</tr>`).join("") + "</table></div>");
    } else if (/^#{1,6}\s/.test(l)) {
      const level = l.match(/^#+/)[0].length;
      out.push(`<div class="h h${Math.min(level, 3)}">${mdInline(l.replace(/^#+\s*/, ""))}</div>`);
      i++;
    } else if (isList(l)) {
      const ordered = /^\s*\d/.test(l);
      const items = [];
      while (i < lines.length && (isList(lines[i]) || (/^\s{2,}\S/.test(lines[i]) && items.length))) {
        const m = lines[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/);
        if (m) items.push({ indent: m[1].length, text: m[3] });
        else items[items.length - 1].text += " " + lines[i].trim();
        i++;
      }
      const tag = ordered ? "ol" : "ul";
      out.push(`<${tag}>` + items.map((it) => `<li style="margin-left:${Math.min(it.indent, 8) * 0.6}em">${mdInline(it.text)}</li>`).join("") + `</${tag}>`);
    } else if (/^\s*>/.test(l)) {
      const buf = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) buf.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push(`<blockquote>${md(buf.join("\n"))}</blockquote>`);
    } else if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(l)) {
      out.push("<hr>");
      i++;
    } else if (!l.trim()) {
      i++;
    } else {
      const buf = [];
      while (i < lines.length && lines[i].trim() && !(buf.length && isBlockStart(lines[i]))) buf.push(lines[i++]);
      out.push(`<p>${buf.map(mdInline).join("<br>")}</p>`);
    }
  }
  return out.join("");
}

const TOOL_ICONS = { Bash: "$", Edit: "✎", MultiEdit: "✎", Write: "✎", NotebookEdit: "✎", Read: "📄", Grep: "🔍", Glob: "🔍",
                     WebFetch: "🌐", WebSearch: "🌐", Task: "◆", Agent: "◆", TodoWrite: "☑", AskUserQuestion: "?" };

function chatState(sid) {
  if (!state.chats[sid]) {
    const scroll = el("div", { className: "chat-scroll" });
    const older = el("button", { className: "chat-older", textContent: "Load earlier messages", hidden: true });
    const msgs = el("div", { className: "msgs" });
    const status = el("div", { className: "chat-status" });
    scroll.append(older, msgs);
    const root = el("div", { className: "chat" }, scroll, status);
    const chat = state.chats[sid] = { sid, root, scroll, older, msgs, status, results: {}, tools: {}, questions: {},
                                      start: 0, end: 0, state: "", loaded: false, peek: "", surfaceId: null };
    scroll.addEventListener("scroll", () => {
      rememberScroll(scroll);
      if (scroll.scrollTop < 80 && chat.start > 0 && !chat.loadingOlder) loadOlder(chat);
    }, { passive: true });
    older.onclick = () => loadOlder(chat);
  }
  return state.chats[sid];
}

function toolRow(item) {
  const row = el("details", { className: "step" });
  row.dataset.call = item.id;
  const icon = TOOL_ICONS[item.tool] || "⚙";
  const name = item.tool.startsWith("mcp__") ? item.tool.split("__").slice(-1)[0] : item.tool;
  const head = el("summary", {},
    el("span", { className: "st" }),
    el("span", { className: "ti", textContent: icon }),
    el("b", { textContent: name }),
    el("span", { className: "ts", textContent: item.tool === "Bash" ? (item.note || item.summary) : item.summary || "" }));
  if (item.additions || item.deletions) {
    head.append(el("span", { className: "diffstat", innerHTML: `<i>+${item.additions}</i> <u>−${item.deletions}</u>` }));
  }
  row.append(head);
  const body = el("div", { className: "sb" });
  if (item.command) body.append(el("pre", { className: "code", textContent: "$ " + item.command }));
  if (item.diff) {
    const pre = el("pre", { className: "code diff" });
    for (const line of item.diff.split("\n")) {
      pre.append(el("span", { className: line[0] === "+" ? "add" : line[0] === "-" ? "del" : "", textContent: line + "\n" }));
    }
    body.append(pre);
  }
  if (item.todos) {
    body.append(el("div", { className: "todos", innerHTML: item.todos.map((t) =>
      `<div class="${t.status}">${t.status === "completed" ? "☑" : t.status === "in_progress" ? "◐" : "☐"} ${esc(t.text)}</div>`).join("") }));
  }
  if (item.detail) body.append(el("pre", { className: "code", textContent: item.detail }));
  body.append(el("pre", { className: "code out", hidden: true }));
  row.append(body);
  return row;
}

function applyResult(chat, result) {
  const row = chat.tools[result.call_id];
  if (row) {
    row.classList.add(result.is_error ? "err" : "ok");
    const out = row.querySelector("pre.out");
    if (result.text) { out.hidden = false; out.textContent = result.text; }
    refreshGroup(row.closest(".steps"));
  }
  for (const card of chat.questions[result.call_id] || []) {
    card.classList.add("answered");
    const ans = card.querySelector(".answer");
    ans.textContent = result.text.replace(/^User has answered[^:]*:\s*/i, "").slice(0, 400);
  }
}

function refreshGroup(group) {
  if (!group) return;
  const rows = group.querySelectorAll(".step");
  const errors = group.querySelectorAll(".step.err").length;
  const running = [...rows].filter((r) => !r.classList.contains("ok") && !r.classList.contains("err")).length;
  const last = rows[rows.length - 1];
  const lastText = last ? last.querySelector("b").textContent + " " + last.querySelector(".ts").textContent : "";
  group.querySelector(":scope > summary .gl").textContent =
    `${rows.length} step${rows.length === 1 ? "" : "s"}` + (errors ? ` · ${errors} failed` : "") + (running ? " · running" : "");
  group.querySelector(":scope > summary .gs").textContent = lastText;
}

function itemNode(chat, item) {
  if (item.kind === "user") return el("div", { className: "msg user", textContent: item.text });
  if (item.kind === "assistant") return el("div", { className: "msg bot", innerHTML: md(item.text) });
  if (item.kind === "note") return el("div", { className: "msg note", textContent: item.text });
  if (item.kind === "question") {
    const card = el("div", { className: "msg question" },
      el("div", { className: "qh", textContent: item.header || "Question" }),
      el("div", { className: "qp", innerHTML: md(item.prompt) }));
    const opts = el("div", { className: "qo" });
    item.options.forEach((o, i) => {
      const b = el("button", {}, el("b", { textContent: `${i + 1}. ${o.label}` }), o.detail ? el("span", { textContent: o.detail }) : null);
      b.onclick = () => answer(chat, i);
      opts.append(b);
    });
    card.append(opts, el("div", { className: "answer" }));
    (chat.questions[item.call_id] = chat.questions[item.call_id] || []).push(card);
    return card;
  }
  return null;
}

// Append items in transcript order; consecutive tool calls share one collapsed group.
function addItems(chat, items, prepend) {
  const frag = document.createDocumentFragment();
  let group = prepend ? null : (chat.msgs.lastElementChild && chat.msgs.lastElementChild.classList.contains("steps") ? chat.msgs.lastElementChild : null);
  const results = [];
  for (const item of items) {
    if (item.kind === "result") { results.push(item); continue; }
    if (item.kind === "tool") {
      if (!group) {
        group = el("details", { className: "steps" }, el("summary", {}, el("span", { className: "gl" }), el("span", { className: "gs" })));
        frag.append(group);
      }
      const row = toolRow(item);
      chat.tools[item.id] = row;
      group.append(row);
      refreshGroup(group);
      continue;
    }
    if (item.kind === "user") chat.msgs.querySelectorAll(".msg.pending").forEach((p) => p.remove());
    const node = itemNode(chat, item);
    if (node) { group = null; frag.append(node); }
  }
  if (prepend) chat.msgs.prepend(frag); else chat.msgs.append(frag);
  for (const r of results) { chat.results[r.call_id] = r; applyResult(chat, r); }
  // Results that arrived before their call (loaded older pages later).
  if (prepend) for (const r of Object.values(chat.results)) applyResult(chat, r);
}

async function loadOlder(chat) {
  chat.loadingOlder = true;
  try {
    const page = await api("/api/chat/history", { session_id: chat.sid, before: chat.start });
    const fromBottom = chat.scroll.scrollHeight - chat.scroll.scrollTop;
    addItems(chat, page.items, true);
    chat.start = page.start;
    chat.older.hidden = chat.start <= 0;
    chat.scroll.scrollTop = chat.scroll.scrollHeight - fromBottom;
  } catch (e) { /* try again on the next scroll */ }
  chat.loadingOlder = false;
}

function setChatState(chat, value) {
  chat.state = value;
  const st = chat.status;
  st.replaceChildren();
  st.className = "chat-status " + value;
  if (value === "working") {
    const stop = el("button", { textContent: "Stop" });
    stop.onclick = () => api("/api/chat/interrupt", { session_id: chat.sid }).catch(() => {});
    st.append(el("span", { className: "spin" }), el("span", { textContent: "Claude is working…" }), stop);
  } else if (value === "needs_input") {
    // Permission prompts are drawn in the terminal and reach the transcript only
    // once answered, so show the bottom of the screen with number keys.
    const keys = el("div", { className: "peek-keys" });
    for (const n of ["1", "2", "3"]) {
      const b = el("button", { textContent: n });
      b.onclick = () => chat.surfaceId && api("/api/send", { surface_id: chat.surfaceId, text: n, enter: false }).then(() => refreshPeek(chat));
      keys.append(b);
    }
    const escB = el("button", { textContent: "Esc" });
    escB.onclick = () => chat.surfaceId && api("/api/key", { surface_id: chat.surfaceId, key: "escape" }).then(() => refreshPeek(chat));
    const term = el("button", { textContent: "Terminal" });
    term.onclick = () => { state.viewBySurface[chat.surfaceId] = "terminal"; renderWorkspace(); };
    keys.append(escB, term);
    st.append(el("div", { className: "peek-head", textContent: "Claude needs your input" }), el("pre", { className: "peek", textContent: chat.peek }), keys);
    refreshPeek(chat);
  } else if (value === "ended") {
    st.append(el("span", { textContent: "This session has ended." }));
  }
}

async function refreshPeek(chat) {
  if (!chat.surfaceId) return;
  try {
    const r = await api("/api/peek", { surface_id: chat.surfaceId });
    const lines = (r.text || "").replace(/\s+$/, "").split("\n");
    chat.peek = lines.slice(-14).join("\n");
    const pre = chat.status.querySelector(".peek");
    if (pre) pre.textContent = chat.peek;
  } catch (e) { /* keep the last one */ }
}

function answer(chat, index) {
  if (!chat.surfaceId) return;
  api("/api/send", { surface_id: chat.surfaceId, text: String(index + 1), enter: false }).then(() => refreshPeek(chat)).catch(() => {});
}

async function chatLoop(poll, sid) {
  const chat = chatState(sid);
  while (state.chatPolls[sid] === poll) {
    await untilVisible(poll);
    if (state.chatPolls[sid] !== poll) return;
    try {
      if (!chat.loaded) {
        const page = await api("/api/chat/history", { session_id: sid }, poll.abort.signal);
        chat.msgs.replaceChildren();
        Object.assign(chat, { results: {}, tools: {}, questions: {}, start: page.start, end: page.end, loaded: true });
        addItems(chat, page.items, false);
        chat.older.hidden = chat.start <= 0;
        setChatState(chat, page.state);
        restoreScroll(chat.scroll);
        continue;
      }
      const upd = await api("/api/chat/poll", { session_id: sid, after: chat.end, state: chat.state }, poll.abort.signal);
      if (state.chatPolls[sid] !== poll) return;
      if (upd.reset) { chat.loaded = false; continue; }
      chat.end = upd.end;
      if (upd.items.length) { addItems(chat, upd.items, false); restoreScroll(chat.scroll); }
      if (upd.state !== chat.state) setChatState(chat, upd.state);
      else if (upd.state === "needs_input") refreshPeek(chat);
    } catch (e) {
      if (state.chatPolls[sid] !== poll || e.name === "AbortError") return;
      chat.status.className = "chat-status error";
      chat.status.textContent = "Chat unavailable: " + e.message;
      await new Promise((ok) => setTimeout(ok, 3000));
    }
  }
}

function restartChatPolls() {
  const want = new Set([...document.querySelectorAll("#panes .chat")].map((c) => c.dataset.session));
  for (const [sid, poll] of Object.entries(state.chatPolls)) {
    if (!want.has(sid)) { poll.abort.abort(); delete state.chatPolls[sid]; }
  }
  for (const sid of want) {
    if (state.chatPolls[sid]) continue;
    const poll = state.chatPolls[sid] = { abort: new AbortController() };
    chatLoop(poll, sid);
  }
}

async function sendChat(s, text) {
  const chat = chatState(s.agent.session_id);
  const pending = el("div", { className: "msg user pending", textContent: text });
  chat.msgs.append(pending);
  delete state.fromBottom[chat.scroll.dataset.surface];
  restoreScroll(chat.scroll);
  try {
    await api("/api/chat/send", { session_id: s.agent.session_id, text });
  } catch (e) {
    pending.classList.add("failed");
    pending.title = e.message;
    throw e;
  }
}

// ---- terminal painting ------------------------------------------------------
function fitFont(pre, columns) {
  const width = pre.clientWidth - 10;
  if (!columns || width <= 0) return;
  if (PHONE.matches && state.fontMode === "read") { pre.style.fontSize = "11px"; return; }
  // Menlo / SF Mono advance is about 0.6em. Phones go smaller so the whole width fits.
  const floor = PHONE.matches ? 4.5 : 7;
  pre.style.fontSize = Math.max(floor, Math.min(13, width / (columns * 0.6))) + "px";
}

// Scroll position lives in state, not in the <pre>: the tree refresh rebuilds
// every pane, and a fresh <pre> would otherwise start at the top.
function rememberScroll(pre) {
  if (!pre.isConnected || pre.restoring) return;
  const up = pre.scrollHeight - pre.scrollTop - pre.clientHeight;
  if (up < 40) delete state.fromBottom[pre.dataset.surface];
  else state.fromBottom[pre.dataset.surface] = up;
}

function restoreScroll(pre) {
  if (!pre.isConnected) return;
  const s = state.screens[pre.dataset.surface];
  if (s && s.grid) fitFont(pre, s.grid.columns);
  const up = state.fromBottom[pre.dataset.surface] || 0;
  pre.restoring = true;
  pre.scrollTop = Math.max(0, pre.scrollHeight - pre.clientHeight - up);
  requestAnimationFrame(() => { pre.restoring = false; });
}

function paintScreen(pre, screen) {
  if (screen.grid) paintGrid(pre, screen.grid);
  else { pre.style.color = ""; pre.style.background = ""; pre.textContent = screen.text || (screen.error ? "[" + screen.error + "]" : ""); }
  restoreScroll(pre);
}

function paintGrid(pre, grid) {
  pre.style.color = grid.foreground;
  pre.style.background = grid.background;
  fitFont(pre, grid.columns);
  const frag = document.createDocumentFragment();
  const cur = grid.cursor || {};
  grid.lines.forEach((spans, lineNo) => {
    let col = 0;
    let pending = "";
    const flush = () => { if (pending) { frag.append(pending); pending = ""; } };
    const styled = (text, sid, extraClass) => {
      const css = grid.styles[String(sid)] || "";
      if (!css && !extraClass) { pending += text; return; }
      flush();
      const span = document.createElement("span");
      if (css) span.style.cssText = css;
      if (extraClass) span.className = extraClass;
      span.textContent = text;
      frag.append(span);
    };
    const cursorCol = cur.visible && cur.line === lineNo ? cur.column : -1;
    for (const [c, w, text, sid] of spans) {
      if (c > col) { pending += " ".repeat(c - col); col = c; }
      if (cursorCol >= col && cursorCol < c + w) {
        // Split the span around the cursor cell.
        const chars = [...text];
        const cw = chars.length ? w / chars.length : 1;
        const at = Math.min(chars.length - 1, Math.floor((cursorCol - c) / cw));
        if (at > 0) styled(chars.slice(0, at).join(""), sid);
        styled(chars[at] || " ", sid, "cur");
        if (at + 1 < chars.length) styled(chars.slice(at + 1).join(""), sid);
      } else {
        styled(text, sid);
      }
      col = c + w;
    }
    if (cursorCol >= col) { pending += " ".repeat(cursorCol - col); styled(" ", 0, "cur"); }
    pending += "\n";
    flush();
  });
  pre.replaceChildren(frag);
}

// ---- polling every visible terminal in one long-poll -------------------------
function visibleTerminals() {
  return [...document.querySelectorAll("#panes pre.term")].map((p) => p.dataset.surface);
}

function restartPolling() {
  const ids = visibleTerminals();
  const key = ids.join(",");
  if (state.poll && state.poll.key === key) return;
  if (state.poll) state.poll.abort.abort();
  if (!ids.length) { state.poll = null; return; }
  state.poll = { key, abort: new AbortController() };
  pollLoop(state.poll, ids);
}

// Agents animate (spinners, timers, a blinking dot), so a busy terminal
// changes every few hundred ms. Redraw at most once a second, and not at all
// while the tab is in the background.
const MIN_POLL_INTERVAL_MS = 1000;

function untilVisible(poll) {
  if (!document.hidden) return Promise.resolve();
  return new Promise((ok) => {
    const done = () => { document.removeEventListener("visibilitychange", check); poll.abort.signal.removeEventListener("abort", done); ok(); };
    const check = () => { if (!document.hidden) done(); };
    document.addEventListener("visibilitychange", check);
    poll.abort.signal.addEventListener("abort", done);
  });
}

async function pollLoop(poll, ids) {
  let lastStart = 0;
  while (state.poll === poll) {
    await untilVisible(poll);
    const wait = lastStart + MIN_POLL_INTERVAL_MS - Date.now();
    if (wait > 0) await new Promise((ok) => setTimeout(ok, wait));
    if (state.poll !== poll) return;
    lastStart = Date.now();
    const surfaces = Object.fromEntries(ids.map((id) => [id, (state.screens[id] || {}).revision || ""]));
    try {
      const r = await api("/api/screens", { surfaces }, poll.abort.signal);
      if (state.poll !== poll) return;
      for (const [id, screen] of Object.entries(r.screens)) {
        if (!screen.changed) continue;
        state.screens[id] = screen;
        document.querySelectorAll(`pre.term[data-surface="${id}"]`).forEach((pre) => paintScreen(pre, screen));
      }
    } catch (e) {
      if (state.poll !== poll || e.name === "AbortError") return;
      await new Promise((ok) => setTimeout(ok, 3000));
    }
  }
}

new ResizeObserver(() => {
  // A new font size changes the content height; keep the same distance from the bottom.
  for (const pre of document.querySelectorAll("#panes pre.term")) restoreScroll(pre);
}).observe($("panes"));

// ---- input -------------------------------------------------------------------
async function send(enter) {
  const s = activeTerminal();
  if (!s) return;
  const text = $("input").value;
  if (chatSurface()) {
    if (!text.trim()) return;
    $("input").value = "";
    growInput();
    await sendChat(s, text).catch(() => { $("input").value = text; growInput(); });
    return;
  }
  if (!text && !enter) return;
  await api("/api/send", { surface_id: s.id, text, enter });
  $("input").value = "";
  growInput();
}

// Grow the box with its text, up to five lines.
function growInput() {
  const box = $("input");
  if (!PHONE.matches) { box.style.height = ""; return; }
  box.style.height = "auto";
  const line = parseFloat(getComputedStyle(box).lineHeight) || 20;
  box.style.height = Math.min(box.scrollHeight + 2, line * 5 + 12) + "px";
}
$("input").addEventListener("input", growInput);

// Tapping a button would blur the text box and drop the on-screen keyboard; keep it up.
for (const b of document.querySelectorAll("#bar button")) {
  b.addEventListener("pointerdown", (e) => { if (document.activeElement === $("input")) e.preventDefault(); });
}

$("sendBtn").onclick = () => send(true);
$("sendRawBtn").onclick = () => send(false);
$("input").addEventListener("keydown", (e) => {
  // In chat on a phone, Return adds a line like a messaging app; Send sends.
  if (chatSurface() && PHONE.matches) return;
  if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); send(true); }
});
for (const b of document.querySelectorAll("#keys button[data-key]")) {
  b.onclick = () => { const s = activeTerminal(); if (s) api("/api/key", { surface_id: s.id, key: b.dataset.key }); };
}
$("showOnMac").onclick = async () => {
  if (!state.wsId) return;
  await api("/api/workspace/select", { workspace_id: state.wsId });
  loadTree();
};

// ---- notifications ------------------------------------------------------------
async function loadNotifications() {
  try {
    const r = await api("/api/notifications");
    state.notifications = r.notifications.slice().sort((a, b) => (b.created_at || "").localeCompare(a.created_at || ""));
    renderNotifications();
    if (state.tree) renderTree();
  } catch (e) { /* the status pill shows connectivity */ }
}

function jumpTo(n) {
  const hit = n.surface_id && findSurface(n.surface_id);
  if (hit) openWorkspace(hit.ws.id, hit.pane.id, hit.surface.id);
  else if (n.workspace_id) openWorkspace(n.workspace_id);
}

function renderNotifications() {
  const list = $("nlist");
  list.replaceChildren();
  const unread = state.notifications.filter((n) => !n.is_read).length;
  $("unreadCount").textContent = unread;
  $("unreadCount").hidden = !unread;
  document.title = (unread ? "(" + unread + ") " : "") + "cmux web remote";
  $("jumpUnread").hidden = $("clearAll").hidden = !state.notifications.length;
  $("jumpUnread").disabled = !unread;
  if (!state.notifications.length) {
    list.append(el("div", { className: "n-empty" }, el("b", { textContent: "No notifications yet" }),
      "Desktop notifications will appear here for quick review."));
    return;
  }
  for (const n of state.notifications) {
    const clear = el("button", { className: "x", textContent: "✕", title: "Clear notification" });
    clear.onclick = async (e) => {
      e.stopPropagation();
      state.notifications = state.notifications.filter((x) => x.id !== n.id);
      renderNotifications();
      try { await api("/api/notifications/dismiss", { id: n.id }); } catch (err) {}
      loadNotifications();
      scheduleTree();
    };
    const time = n.created_at ? new Date(n.created_at).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
    const item = el("div", { className: "n" + (n.is_read ? "" : " unread") },
      el("span", { className: "dot" }),
      el("div", { className: "main" },
        el("div", { className: "top" }, el("span", { className: "nt", textContent: n.title || "(no title)" }), el("span", { className: "time", textContent: time })),
        n.body || n.subtitle ? el("div", { className: "nb", textContent: plainMarkdown([n.subtitle, n.body].filter(Boolean).join("\n")).trim() }) : null,
        n.tab_title ? el("div", { className: "tab", textContent: n.tab_title }) : null),
      clear);
    item.onclick = () => { jumpTo(n); document.body.classList.remove("show-notifs"); };
    list.append(item);
  }
}

$("filter").addEventListener("input", renderTree);
$("bell").onclick = (e) => { e.stopPropagation(); document.body.classList.toggle("show-notifs"); };
$("notifs").onclick = (e) => e.stopPropagation();
document.addEventListener("click", () => document.body.classList.remove("show-notifs"));
$("jumpUnread").onclick = () => {
  const n = state.notifications.find((x) => !x.is_read);  // newest first
  if (n) { jumpTo(n); document.body.classList.remove("show-notifs"); }
};
$("clearAll").onclick = async () => {
  state.notifications = [];
  renderNotifications();
  try { await api("/api/notifications/clear_all", {}); } catch (e) {}
  loadNotifications();
  scheduleTree();
};

function showBrowserNotification(n) {
  if (!n || !("Notification" in window) || Notification.permission !== "granted") return;
  if (document.visibilityState === "visible" && document.hasFocus()) return;
  const notice = new Notification(n.title || "cmux", { body: [n.subtitle, n.body].filter(Boolean).join("\n"), tag: n.id });
  notice.onclick = () => { window.focus(); jumpTo(n); };
}

$("enableNotify").onclick = async () => {
  if (!("Notification" in window)) { alert("This browser has no Notification API (on iOS, add the page to the Home Screen first)."); return; }
  const p = await Notification.requestPermission();
  if (p !== "granted") alert("Browser notifications need HTTPS (or localhost) and permission.");
};

// ---- live events ----------------------------------------------------------------
let treeTimer = null;
function scheduleTree() { clearTimeout(treeTimer); treeTimer = setTimeout(loadTree, 400); }

function connectEvents() {
  const es = new EventSource("/api/events");
  es.onmessage = (msg) => {
    const m = JSON.parse(msg.data);
    if (m.type === "status") {
      $("status").className = m.connected ? "ok" : "bad";
      $("status").textContent = m.connected ? "live" : "cmux offline";
      if (m.connected) { loadTree(); loadNotifications(); }
      return;
    }
    if (m.type === "sidebar") {
      // Status pills, log or progress of one row changed.
      const ws = allWorkspaces().find((w) => w.id === m.workspace_id);
      if (ws) { ws.sidebar = m.sidebar; renderTree(); }
      return;
    }
    if (m.category === "notification") {
      if (m.name === "notification.created") showBrowserNotification(m.notification);
      loadNotifications();
      scheduleTree();  // unread counts and the row's notification preview
    } else if (m.category === "workspace" || m.category === "surface") {
      scheduleTree();
    }
  };
  es.onerror = () => { $("status").className = "bad"; $("status").textContent = "reconnecting"; };
}

$("toggleSide").onclick = () => document.body.classList.toggle("show-side");
$("scrim").onclick = () => document.body.classList.remove("show-side");

function applyPhoneLayout() {
  updateTarget();
  growInput();
  if (state.tree) renderWorkspace();
}
PHONE.addEventListener("change", applyPhoneLayout);
applyPhoneLayout();

// iOS keeps the layout viewport when the keyboard opens; size the page to what is visible.
if (window.visualViewport) {
  const fitViewport = () => {
    document.documentElement.style.setProperty("--vvh", visualViewport.height + "px");
    if (visualViewport.offsetTop) window.scrollTo(0, 0);
    for (const pre of document.querySelectorAll("#panes pre.term")) restoreScroll(pre);
  };
  visualViewport.addEventListener("resize", fitViewport);
  visualViewport.addEventListener("scroll", fitViewport);
  fitViewport();
}

loadTree();
loadNotifications();
connectEvents();
</script>
</body>
</html>
